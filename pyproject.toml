[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "induce-text"
version = "0.1.0"
description = "Program synthesis for language modelling, scored as compression (Hutter Prize / enwik)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
induce-text = "induce_text.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/induce_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
